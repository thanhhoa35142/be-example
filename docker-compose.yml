name: backend

services:
  db:
    image: postgis/postgis:18-3.6
    container_name: picnic-postgres
    environment:
      POSTGRES_USER: picnic
      POSTGRES_PASSWORD: picnic
      POSTGRES_DB: picnic
    ports:
      - "127.0.0.1:4343:5432"
    volumes:
      - picnicdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picnic -d picnic"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks: [pickhour]

  migrate:
    build: .
    image: pickhour-backend:latest
    container_name: picnic-migrate
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://picnic:picnic@db:5432/picnic?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [pickhour]

  api:
    build: .
    image: pickhour-backend:latest
    container_name: picnic-api
    command: ["/app/api"]
    environment:
      PORT: "8080"
      RUN_MIGRATIONS: "false"
      DATABASE_URL: postgres://picnic:picnic@db:5432/picnic?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [pickhour]

  worker:
    build: .
    image: pickhour-backend:latest
    container_name: picnic-worker
    command: ["/app/worker"]
    environment:
      RUN_MIGRATIONS: "false"
      DATABASE_URL: postgres://picnic:picnic@db:5432/picnic?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [pickhour]

  mcp:
    build: .
    image: pickhour-backend:latest
    container_name: picnic-mcp
    command: ["/app/mcp"]
    environment:
      MCP_PORT: "8081"
      RUN_MIGRATIONS: "false"
      DATABASE_URL: postgres://picnic:picnic@db:5432/picnic?sslmode=disable
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [pickhour]

volumes:
  picnicdata:

networks:
  pickhour:
