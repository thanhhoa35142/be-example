openapi: 3.0.3
info:
  title: Pickhour API
  version: "0.1.0"
  description: |
    Picnic-spot scoring API. Hourly 0-100 scores with explanations.

    Conventions:
    - Success responses (except `/v1/spots` bbox) are wrapped in `{ "data": ... }`.
    - Errors are RFC 7807 `application/problem+json` with a stable `code`.
    - All timestamps are RFC3339 UTC. Distances in meters. Coordinates `[lon, lat]`.
    - Limits: per-client-IP rate limits (reads 600/min, writes 60/min, `POST /v1/devices` 30/hour by default) answer `429 rate_limited` with `Retry-After`; request bodies are capped (64 KiB default, 512 KiB `/v1/events`, 256 KiB App Store webhook) and answer `413 payload_too_large`.
    - Requests without a body identify the device with the `X-Device-ID` header (preferred); the legacy `deviceId` query parameter is still accepted.
servers:
  - url: http://localhost:8080
    description: local dev
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /readyz:
    get:
      summary: Readiness probe (checks DB)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "503":
          description: Unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: unavailable }

  /v1/spots:
    get:
      summary: Spots in viewport (GeoJSON FeatureCollection)
      description: Returns raw GeoJSON — NOT wrapped in `data`.
      parameters:
        - name: bbox
          in: query
          required: true
          schema: { type: string }
          description: "west,south,east,north in WGS84 degrees; each axis <= 0.5"
          example: "4.7,52.3,4.95,52.42"
        - name: when
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Score hour; truncated to the hour; default now
      responses:
        "200":
          description: GeoJSON FeatureCollection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureCollection" }
        "400":
          description: Invalid bbox
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                tooLarge:
                  value:
                    type: about:blank
                    code: bbox_too_large
                    title: Bbox too large
                    status: 400
                    detail: zoom in or reduce the viewport
                    instance: /v1/spots
                    requestId: 3f6569db-3d46-41c5-a1dd-11335502dcce

  /v1/spots/{id}:
    get:
      summary: Spot detail
      parameters:
        - $ref: "#/components/parameters/SpotId"
      responses:
        "200":
          description: Spot detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SpotDetail" }
        "301":
          description: Spot merged — follow Location header
          headers:
            Location:
              schema: { type: string }
              description: "/v1/spots/{newId}"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/spots/{id}/forecast:
    get:
      summary: Hourly scores for the next 7 days (168 points)
      parameters:
        - $ref: "#/components/parameters/SpotId"
      responses:
        "200":
          description: Forecast points
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ForecastPoint" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/recommendations:
    get:
      summary: Best spots around a point
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: radius
          in: query
          required: false
          schema: { type: number, format: double, default: 5000, maximum: 50000 }
          description: meters
        - name: when
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 3, maximum: 50 }
          description: Free tier default is 3
      responses:
        "200":
          description: Ranked recommendations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RecommendationList" }
        "400":
          description: Invalid query
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/devices:
    post:
      summary: Register or refresh a device
      description: id is client-generated UUID stored in Keychain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegister" }
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Lost race between concurrent registrations of the same apnsToken (retry). A token held by another device is otherwise taken over by the new device.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/devices/{id}:
    delete:
      summary: Soft-delete device (GDPR unlink)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/spots/{id}/reports:
    post:
      summary: Confirm a spot or report it wrong
      description: One report per device/spot/type/day; duplicates return status=duplicate.
      parameters:
        - $ref: "#/components/parameters/SpotId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpotReportRequest" }
      responses:
        "201":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportStatus" }
        "200":
          description: Duplicate (same day)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportStatus" }
        "400":
          description: invalid_report - unknown type, or type=issue without a valid issueCode
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Device or spot not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Rate limited (30 spot reports/device/24h)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/spots/{id}/crowd-reports:
    post:
      summary: "Busy / moderate / quiet vote for current hour"
      description: Call only when user is near the spot; proximity verified on-device. Server derives local dow/hour from device tz.
      parameters:
        - $ref: "#/components/parameters/SpotId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrowdReportRequest" }
      responses:
        "201":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportStatus" }
        "429":
          description: Rate limited (30/device/24h)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/scores/feedback:
    post:
      summary: "Is this score right? verdict"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoreFeedbackRequest" }
      responses:
        "201":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportStatus" }
        "400":
          description: invalid_report - tsHour not on the hour or outside [now-72h, now+7d+1h]
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Unknown device or inactive spot
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Rate limited (100/device/24h)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/alerts:
    get:
      summary: List alert rules for a device
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
        - name: deviceId
          in: query
          required: false
          deprecated: true
          description: Legacy; use the X-Device-ID header.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Alert rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AlertRule" }
    post:
      summary: Create an alert rule (plan-limited)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AlertRule" }
        "400":
          description: invalid_body - bad shape/range, startLocal/endLocal not HH:MM or equal, tz not an IANA zone (empty and Local rejected)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Free plan limit (1 rule), enforced atomically
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Unknown device, or spotId does not reference an active spot
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/alerts/{id}:
    put:
      summary: Replace an alert rule
      parameters:
        - $ref: "#/components/parameters/SpotId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AlertRule" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      summary: Delete an alert rule
      parameters:
        - $ref: "#/components/parameters/SpotId"
        - $ref: "#/components/parameters/DeviceIdHeader"
        - name: deviceId
          in: query
          required: false
          deprecated: true
          description: Legacy; use the X-Device-ID header.
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/devices/{id}/digest:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Create or replace the weekend digest (Plus only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeeklyDigestRequest" }
      responses:
        "200":
          description: Saved (merged spot ids resolved to their target; unknown/inactive ids dropped and listed in skippedIds)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/WeeklyDigest"
                      - type: object
                        properties:
                          skippedIds:
                            type: array
                            description: Requested ids dropped (unknown/inactive spot); always present on PUT, empty when none
                            items: { type: string, format: uuid }
        "400":
          description: invalid_body (bad shape, non-UUID id, >20 ids, or no known active spot left while enabled) or invalid_id
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: plan_limit (Free plan)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Unknown device (not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    get:
      summary: Current weekend digest
      responses:
        "200":
          description: Digest
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WeeklyDigest" }
        "404":
          description: No digest (not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      summary: Remove the weekend digest (idempotent)
      responses:
        "204": { description: Deleted }

  /v1/devices/{id}/entitlement:
    get:
      summary: Resolved plan for a device
      parameters:
        - $ref: "#/components/parameters/SpotId"
      responses:
        "200":
          description: Entitlement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Entitlement" }

  /v1/entitlement/link:
    post:
      summary: Link a StoreKit signed transaction to a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, signedTransaction]
              properties:
                deviceId: { type: string, format: uuid }
                signedTransaction: { type: string }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      plan: { type: string, enum: [free, plus] }
        "400":
          description: Malformed, unsigned or forged JWS (signature/x5c chain not rooted in Apple Root CA G3), wrong bundleId, or unsupported environment
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: account_mismatch - the transaction's appAccountToken (a UUID) names another device
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: device_limit - the subscription is already linked to 5 active devices
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: service_unavailable - App Store verification not configured (APPSTORE_BUNDLE_ID unset)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/appstore/notifications:
    post:
      summary: App Store Server Notifications V2 webhook
      description: |
        Authenticated only by the JWS: the outer signedPayload and the nested signedTransactionInfo are verified (ES256, x5c chain to Apple Root CA G3, bundleId, environment). A nested transaction that fails verification rejects the whole notification (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              properties:
                signedPayload: { type: string }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: accepted }
        "400":
          description: Invalid or forged signedPayload
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: service_unavailable - verification not configured
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

components:
  parameters:
    DeviceIdHeader:
      name: X-Device-ID
      in: header
      required: false
      description: Device UUID for requests without a body (preferred over the legacy deviceId query parameter).
      schema: { type: string, format: uuid }
    SpotId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Problem:
      type: object
      required: [type, code, title, status]
      properties:
        type: { type: string, example: "about:blank" }
        code:
          type: string
          enum: [bad_request, invalid_id, invalid_bbox, bbox_too_large, invalid_when, invalid_query, invalid_body, invalid_report, not_found, merged_spot, conflict, rate_limited, plan_limit, payload_too_large, unauthorized, device_limit, account_mismatch, service_unavailable, internal_error]
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string, format: uuid }

    Names:
      type: object
      additionalProperties: { type: string }
      description: lang code -> localized name; fallback key "name"
      example: { name: Vondelpark, en: Vondelpark, nl: Vondelpark }

    ScoreSnapshot:
      type: object
      nullable: true
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        confidence: { type: integer, minimum: 1, maximum: 3 }
        capReason: { type: string, nullable: true, enum: [rain, heat, cold, dark, twilight, null] }
        reasons:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Reason" }
        computedAt: { type: string, format: date-time }

    Reason:
      type: object
      required: [code]
      description: >-
        Machine-readable reason code; clients translate to localized strings.
        Codes may grow — tolerate unknown values. Current catalog in docs/API.md
        (source of truth: backend/internal/modules/scoring/scorer.go).
      properties:
        code:
          type: string
          example: weather.rain_risk
        params:
          type: object
          additionalProperties: true
          example: { temp: 21 }

    SpotProperties:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [park, beach, site, table] }
        name: { type: string, nullable: true }
        names: { $ref: "#/components/schemas/Names" }
        country: { type: string }
        city: { type: string, nullable: true }
        tz: { type: string, example: Europe/Amsterdam }
        lastVerifiedAt: { type: string, format: date-time, nullable: true }
        when: { type: string, format: date-time }
        score: { $ref: "#/components/schemas/ScoreSnapshot" }

    FeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string, enum: [FeatureCollection] }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, enum: [Feature] }
              geometry:
                type: object
                properties:
                  type: { type: string, enum: [Point] }
                  coordinates:
                    type: array
                    items: { type: number, format: double }
                    minItems: 2
                    maxItems: 2
                    description: "[lon, lat]"
              properties: { $ref: "#/components/schemas/SpotProperties" }

    Amenity:
      type: object
      properties:
        type: { type: string, example: toilet }
        distanceM: { type: integer }
        source: { type: string, example: osm }

    Source:
      type: object
      properties:
        source: { type: string, example: osm }
        sourceId: { type: string, example: "node/12345" }
        version: { type: integer, nullable: true }
        importedAt: { type: string, format: date-time }

    SpotDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [park, beach, site, table] }
        name: { type: string, nullable: true }
        names: { $ref: "#/components/schemas/Names" }
        coordinates:
          type: array
          items: { type: number, format: double }
          minItems: 2
          maxItems: 2
          description: "[lon, lat]"
        area:
          type: object
          nullable: true
          description: GeoJSON MultiPolygon
        country: { type: string }
        city: { type: string, nullable: true }
        tz: { type: string }
        lastVerifiedAt: { type: string, format: date-time, nullable: true }
        amenities:
          type: array
          items: { $ref: "#/components/schemas/Amenity" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }

    ForecastPoint:
      type: object
      required: [tsHour, score, components, reasons, confidence]
      properties:
        tsHour: { type: string, format: date-time }
        score: { type: integer, minimum: 0, maximum: 100 }
        components:
          type: object
          description: per-component 0-100; absent key = missing data
          properties:
            weather: { type: integer }
            crowd: { type: integer }
            amenity: { type: integer }
            shade: { type: integer }
            fresh: { type: integer }
        capReason: { type: string, nullable: true }
        reasons:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Reason" }
        confidence: { type: integer, minimum: 1, maximum: 3 }
        weather:
          type: object
          description: raw provider forecast for this hour (metric); absent when the hour has no weather row, and each key is absent when the provider had no value
          properties:
            tempC: { type: number }
            feelsLikeC: { type: number }
            precipProb: { type: integer, minimum: 0, maximum: 100 }
            windKmh: { type: number }
            uv: { type: number }
            cloud: { type: integer, minimum: 0, maximum: 100 }

    RecommendationItem:
      allOf:
        - $ref: "#/components/schemas/SpotDetail"
        - type: object
          properties:
            distanceM: { type: number, format: double }
            score: { $ref: "#/components/schemas/ScoreSnapshot" }

    RecommendationList:
      type: object
      properties:
        when: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/RecommendationItem" }

    DeviceRegister:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid, description: client-generated, stored in Keychain }
        apnsToken: { type: string, nullable: true, minLength: 32, maxLength: 200, pattern: "^[0-9a-fA-F]+$", description: "hex; a token held by another live device is taken over" }
        apnsEnv: { type: string, enum: [sandbox, production], nullable: true }
        locale: { type: string, nullable: true, example: en, maxLength: 35, pattern: "^[A-Za-z0-9_-]+$" }
        tz: { type: string, nullable: true, example: Europe/Amsterdam, maxLength: 64, description: "valid IANA zone; Local rejected" }
        appVersion: { type: string, nullable: true, maxLength: 32, pattern: "^[A-Za-z0-9._+-]+$" }
        prefs:
          type: object
          description: at most 4096 bytes serialized
          additionalProperties: true
          example: { tempUnit: celsius, distUnit: km }

    SpotReportRequest:
      type: object
      required: [deviceId, type]
      properties:
        deviceId: { type: string, format: uuid }
        type: { type: string, enum: [confirm, missing, closed, issue] }
        issueCode: { type: string, nullable: true, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$", description: "required when type=issue, ignored otherwise" }

    CrowdReportRequest:
      type: object
      required: [deviceId, level]
      properties:
        deviceId: { type: string, format: uuid }
        level: { type: integer, minimum: 1, maximum: 3, description: "1=quiet 2=moderate 3=busy" }

    ScoreFeedbackRequest:
      type: object
      required: [deviceId, spotId, tsHour, verdict]
      properties:
        deviceId: { type: string, format: uuid }
        spotId: { type: string, format: uuid }
        tsHour: { type: string, format: date-time }
        verdict: { type: integer, minimum: -1, maximum: 1, description: "-1 too low, 0 right, +1 too high" }

    ReportStatus:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [accepted, duplicate] }

    AlertRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        spotId: { type: string, format: uuid, nullable: true }
        h3Cell: { type: integer, format: int64, nullable: true }
        areaCenter:
          type: object
          nullable: true
          description: "H3 cell center (3 decimals) for area rules; null for spot rules"
          properties:
            lat: { type: number }
            lon: { type: number }
        radiusM: { type: integer, nullable: true }
        minScore: { type: integer, minimum: 0, maximum: 100 }
        daysMask: { type: integer, minimum: 1, maximum: 127, description: "bit i = weekday i (0=Sunday)" }
        startLocal: { type: string, example: "08:00" }
        endLocal: { type: string, example: "10:00" }
        tz: { type: string, example: "Europe/Amsterdam" }
        enabled: { type: boolean }

    WeeklyDigestRequest:
      type: object
      required: [spotIds, enabled]
      properties:
        spotIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        enabled: { type: boolean }
    WeeklyDigest:
      type: object
      properties:
        spotIds:
          type: array
          items: { type: string, format: uuid }
        enabled: { type: boolean }
        sendDow: { type: integer, minimum: 0, maximum: 6, description: "0 = Sunday" }
        sendHour: { type: integer, minimum: 0, maximum: 23, description: "device-local hour" }
    AlertRuleRequest:
      type: object
      required: [deviceId, minScore, daysMask, startLocal, endLocal, tz]
      properties:
        deviceId: { type: string, format: uuid }
        spotId: { type: string, format: uuid, description: "exactly one of spotId, h3Cell or area" }
        h3Cell: { type: integer, format: int64, description: "needs radiusM" }
        area:
          type: object
          description: "coarse point; server rounds to 2 decimals, converts to an H3 res-7 cell and stores only the cell. Needs radiusM"
          required: [lat, lon]
          properties:
            lat: { type: number, minimum: -90, maximum: 90, example: 52.36 }
            lon: { type: number, minimum: -180, maximum: 180, example: 4.88 }
        radiusM: { type: integer, minimum: 1, maximum: 50000, description: "required with h3Cell/area; rejected with spotId" }
        minScore: { type: integer, minimum: 0, maximum: 100 }
        daysMask: { type: integer, minimum: 1, maximum: 127 }
        startLocal: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        endLocal: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        tz: { type: string }
        enabled: { type: boolean }

    Entitlement:
      type: object
      properties:
        plan: { type: string, enum: [free, plus] }
        productId: { type: string }
        expiresAt: { type: string, format: date-time }
        isTrial: { type: boolean }
        autoRenew: { type: boolean }
