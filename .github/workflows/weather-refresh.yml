name: weather-refresh

# Self-hosted Open-Meteo weather refresh (docs/WEATHER_SELFHOST_PROPOSAL.md).
# Each run: spin up an ephemeral Postgres, restore the slim picnic_ci dump
# from the private Backblaze B2 bucket (picnic_ci.dump), sync GFS/GEFS +
# DEM from the open-data bucket, serve the forecast API locally, then run
# `worker -job weather.refresh` against the ephemeral DB.
#
# Schedule enabled after gfs-lag-probe measurements (2026-11-15/16):
# gefs05 precipitation_probability is the bottleneck, landing ~6.7h
# after each GFS cycle (00/06/12/18 UTC), with one observed outlier
# >7.5h. Cron runs ~80min after the typical landing (~00:42/06:42/
# 12:42/18:42 UTC):
#   cron: "0 2,8,14,20 * * *"   -> 02:00, 08:00, 14:00, 20:00 UTC
#
# Prod path (later): point DATABASE_URL at the prod DB over Tailscale
# (tag:ci -> tcp:5432 ACL, secret TS_AUTHKEY + PROD_DATABASE_URL), and
# disable this ephemeral-DB path via the `target` input.

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "ephemeral (restore dump in-job) — prod comes later"
        type: choice
        options: [ephemeral]
        default: ephemeral
      models:
        description: "Sync model domains"
        type: string
        default: "ncep_gfs013,ncep_gefs025,ncep_gefs05"
      api_models:
        description: "models= value for the forecast API"
        type: string
        default: "gfs_global"
      past_days:
        description: "Sync --past-days"
        type: string
        default: "2"

concurrency:
  group: weather-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: picnic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # `inputs` is empty on schedule events — fall back to the
      # workflow_dispatch defaults so cron runs get the same config.
      MODELS: ${{ inputs.models || 'ncep_gfs013,ncep_gefs025,ncep_gefs05' }}
      API_MODELS: ${{ inputs.api_models || 'gfs_global' }}
      PAST_DAYS: ${{ inputs.past_days || '2' }}
      VARS: "temperature_2m,relative_humidity_2m,dew_point_2m,wind_u_component_10m,wind_v_component_10m,precipitation,precipitation_probability,cloud_cover,uv_index,shortwave_radiation"
      IMAGE: ghcr.io/open-meteo/open-meteo:latest
      DATABASE_URL: postgres://postgres:test@localhost:5432/picnic?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build worker
        run: go build -o /tmp/worker ./cmd/worker

      - name: Download test DB dump
        # picnic_ci.dump lives in a private B2 bucket — the repo is public,
        # so dumps must not go through public releases/artifacts.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: us-west-004
        run: |
          endpoint="${{ secrets.B2_ENDPOINT }}"
          case "$endpoint" in http://*|https://*) ;; *) endpoint="https://$endpoint";; esac
          aws s3 cp "s3://${{ secrets.B2_BUCKET_NAME }}/picnic_ci.dump" \
            /tmp/picnic_ci.dump --endpoint-url "$endpoint"

      - name: Restore dump
        run: |
          # Benign pg_restore errors tolerated: tiger/topology schemas the
          # postgis image pre-creates, and three transition-trigger functions
          # that are not part of the slim dump (triggers simply absent).
          # Any other pg_restore error still fails the step.
          docker run --rm --network host -e PGPASSWORD=test -v /tmp:/w postgis/postgis:18-3.6 \
            sh -c 'pg_restore -h localhost -U postgres -d picnic --no-owner --no-privileges /w/picnic_ci.dump 2>/tmp/restore.err; rc=$?; cat /tmp/restore.err; \
              if [ $rc -ne 0 ]; then grep "pg_restore: error" /tmp/restore.err | grep -v "schema \"tiger\" already exists\|schema \"topology\" already exists\|fn_t_city_packs_transition\|fn_t_job_runs_transition\|fn_t_spots_transition" && exit 1 || true; fi'

      - name: Sanity check cells
        run: |
          docker run --rm --network host -e PGPASSWORD=test postgis/postgis:18-3.6 \
            psql "$DATABASE_URL" -t -c \
            "SELECT count(*) AS cells FROM (SELECT DISTINCT cell_id FROM t_spots) s" \
            -c "SELECT count(*) AS forecast_rows FROM t_weather_hourly_forecasts"

      - name: Create data volume
        run: docker volume create open-meteo-data

      - name: Sync DEM
        run: |
          docker run --rm -v open-meteo-data:/app/data $IMAGE \
            sync copernicus_dem90 static

      - name: Sync model data
        run: |
          echo "models=$MODELS past_days=$PAST_DAYS"
          time docker run --rm -v open-meteo-data:/app/data $IMAGE \
            sync "$MODELS" "$VARS" --past-days "$PAST_DAYS" --concurrent 8

      - name: Start forecast API
        run: |
          docker run -d --name open-meteo -v open-meteo-data:/app/data \
            -p 8080:8080 $IMAGE serve --env production --hostname 0.0.0.0 --port 8080
          for i in $(seq 1 60); do
            curl -sf "http://localhost:8080/v1/forecast?latitude=52.37&longitude=4.90&hourly=temperature_2m&forecast_days=1&models=gfs013" >/dev/null && break
            sleep 2
          done

      - name: Run weather.refresh
        env:
          OPEN_METEO_URL: http://localhost:8080/v1/forecast
          OPEN_METEO_MODELS: ${{ inputs.api_models }}
          WEATHER_DAILY_LIMIT: "0"
          RUN_MIGRATIONS: "false"
          APP_ENV: production
        run: /tmp/worker -job weather.refresh

      - name: Job outcome
        if: always()
        run: |
          docker run --rm --network host -e PGPASSWORD=test postgis/postgis:18-3.6 \
            psql "$DATABASE_URL" -c \
            "SELECT job, status, started_at, finished_at, rows_affected, left(coalesce(error,''),200) AS error FROM t_job_runs WHERE job='weather.refresh' ORDER BY id DESC LIMIT 3" || true
          docker run --rm --network host -e PGPASSWORD=test postgis/postgis:18-3.6 \
            psql "$DATABASE_URL" -t -c \
            "SELECT count(*) AS forecast_rows, count(DISTINCT cell_id) AS cells FROM t_weather_hourly_forecasts" || true
