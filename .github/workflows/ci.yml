name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: picnic
          POSTGRES_USER: picnic
          POSTGRES_PASSWORD: picnic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U picnic -d picnic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://picnic:picnic@localhost:5432/picnic?sslmode=disable"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      # Generated persistence code must match db/queries + db/migrations
      # (catches a query edit without `make sqlc`). Version = local sqlc.
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"

      - name: sqlc diff
        run: sqlc diff

      - name: Run migrations
        run: go run ./cmd/migrate

      - name: Test
        run: make test

      # Released v2.6.2 binaries are built with go1.25 and refuse go 1.26
      # targets, so it is built from source with the runner's Go toolchain
      # (1-2 min) — cached per lint version + Go version.
      - name: Go version
        id: gover
        run: echo "v=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache golangci-lint
        id: lintcache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v2.6.2-${{ steps.gover.outputs.v }}-${{ runner.os }}

      - name: Install golangci-lint
        if: steps.lintcache.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2

      - name: Lint (vet + gofmt)
        run: make lint

      - name: Build
        run: make build
