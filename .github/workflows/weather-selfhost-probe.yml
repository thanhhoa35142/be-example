name: weather-selfhost-probe

# Phase 0 probe for docs/WEATHER_SELFHOST_PROPOSAL.md:
# measures whether a self-hosted Open-Meteo container on a GitHub runner
# can serve all 6 hourly variables our worker needs, for ~15 days,
# within runner disk/time limits — and how far its output drifts from
# api.open-meteo.com.
#
# Nothing is written to any database; this only exercises the container.
# Usage: Actions → weather-selfhost-probe → Run workflow.
# Try a different model by editing the `models` input, e.g.
#   ecmwf_ifs025 | ncep_gfs013 | cmc_gem_gdps | ukmo_global_deterministic_10km

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Sync model domains (comma-separated)"
        type: string
        default: "ecmwf_ifs025"
      past_days:
        description: "Sync --past-days (keep recent files only)"
        type: string
        default: "2"

concurrency:
  group: weather-selfhost-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      MODELS: ${{ inputs.models }}
      PAST_DAYS: ${{ inputs.past_days }}
      # Raw storage variables that back our 6 API outputs:
      #   temperature_2m            -> temperature_2m
      #   apparent_temperature      <- temperature_2m + relative_humidity_2m + wind_u/v_10m (+ dew_point_2m)
      #   precipitation_probability <- precipitation_probability (or derived)
      #   wind_speed_10m            <- wind_u_component_10m + wind_v_component_10m
      #   uv_index                  <- uv_index (+ shortwave_radiation for derivation)
      #   cloud_cover               <- cloud_cover
      VARS: "temperature_2m,relative_humidity_2m,dew_point_2m,wind_u_component_10m,wind_v_component_10m,precipitation,precipitation_probability,cloud_cover,uv_index,shortwave_radiation"
      IMAGE: ghcr.io/open-meteo/open-meteo:latest

    steps:
      - name: Disk before
        run: df -h / /mnt 2>/dev/null || df -h /

      - name: Create data volume
        run: docker volume create open-meteo-data

      - name: Sync DEM (required for terrain/uv corrections)
        run: |
          docker run --rm -v open-meteo-data:/app/data $IMAGE \
            sync copernicus_dem90 static

      - name: Sync model data
        run: |
          echo "models=$MODELS past_days=$PAST_DAYS"
          time docker run --rm -v open-meteo-data:/app/data $IMAGE \
            sync "$MODELS" "$VARS" --past-days "$PAST_DAYS" --concurrent 8

      - name: Disk after sync
        run: |
          df -h / /mnt 2>/dev/null || df -h /
          docker run --rm -v open-meteo-data:/app/data alpine \
            sh -c 'du -sh /app/data; ls /app/data | head -30' || true

      - name: Start API server
        run: |
          docker run -d --name open-meteo -v open-meteo-data:/app/data \
            -p 8080:8080 $IMAGE serve --env production --hostname 0.0.0.0 --port 8080
          for i in $(seq 1 60); do
            curl -sf "http://localhost:8080/v1/forecast?latitude=52.37&longitude=4.90&hourly=temperature_2m&forecast_days=1" >/dev/null && break
            sleep 2
          done
          curl -s "http://localhost:8080/v1/forecast?latitude=52.37&longitude=4.90&hourly=temperature_2m&forecast_days=1" | head -c 400

      - name: Probe cells vs api.open-meteo.com
        run: |
          python3 - <<'EOF'
          import json, urllib.request, datetime, math, os

          HOURLY = "temperature_2m,apparent_temperature,precipitation_probability,wind_speed_10m,uv_index,cloud_cover"
          # ~12 cells spread over our coverage (lat -38..59, lng -123..153)
          CELLS = [
            ("Amsterdam", 52.37, 4.90), ("Paris", 48.85, 2.35),
            ("London", 51.51, -0.13), ("Berlin", 52.52, 13.40),
            ("New York", 40.71, -74.01), ("Chicago", 41.88, -87.63),
            ("Los Angeles", 34.05, -118.24), ("Vancouver", 49.28, -123.12),
            ("Singapore", 1.35, 103.82), ("Tokyo", 35.68, 139.69),
            ("Sydney", -33.87, 151.21), ("Rio", -22.91, -43.17),
            ("Nairobi", -1.29, 36.82), ("Helsinki", 60.17, 24.94),
          ]
          today = datetime.date.today()
          start = today.isoformat()
          end = (today + datetime.timedelta(days=15)).isoformat()

          def fetch(base, lat, lng):
            q = (f"latitude={lat}&longitude={lng}&hourly={HOURLY}"
                 f"&timezone=UTC&start_date={start}&end_date={end}"
                 f"&wind_speed_unit=kmh&precipitation_unit=mm")
            req = urllib.request.Request(base + "/v1/forecast?" + q,
                                         headers={"User-Agent": "pickhour-probe/0.1"})
            with urllib.request.urlopen(req, timeout=60) as r:
                return json.load(r)

          LOCAL = "http://localhost:8080"
          REMOTE = "https://api.open-meteo.com"
          summary = {"cells": {}, "remote_errors": 0}
          diffs = {v: [] for v in ["temperature_2m", "apparent_temperature", "wind_speed_10m", "uv_index", "cloud_cover", "precipitation_probability"]}

          for name, lat, lng in CELLS:
            try:
                loc = fetch(LOCAL, lat, lng)
            except Exception as e:
                summary["cells"][name] = {"error": str(e)[:200]}
                continue
            h = loc.get("hourly", {})
            times = h.get("time", [])
            stats = {"n_hours": len(times),
                     "first": times[0] if times else None,
                     "last": times[-1] if times else None,
                     "non_null": {}}
            for v in HOURLY.split(","):
                vals = h.get(v) or []
                stats["non_null"][v] = sum(1 for x in vals if x is not None)
            summary["cells"][name] = stats

            # drift vs hosted API at a few lead times
            try:
                rem = fetch(REMOTE, lat, lng)
            except Exception:
                summary["remote_errors"] += 1
                continue
            rh = rem.get("hourly", {})
            rt = rh.get("time", [])
            for v in diffs:
                a, b = h.get(v) or [], rh.get(v) or []
                # compare at local indices 24, 72, 120 if remote has same timestamp
                for idx in (24, 72, 120):
                    if idx < len(a) and idx < len(b) and a[idx] is not None and b[idx] is not None \
                       and rt[idx] == times[idx]:
                        diffs[v].append(abs(a[idx] - b[idx]))

          out = ["## Self-host probe results", ""]
          out.append(f"Models synced: {os.environ.get('MODELS')}")
          out.append(f"Window: {start} .. {end} UTC")
          out.append("")
          out.append("| cell | hours | first | last | " + " | ".join(HOURLY.split(",")) + " |")
          out.append("|---|---|---|---|" + "---|" * len(HOURLY.split(",")))
          for name, s in summary["cells"].items():
              if "error" in s:
                  out.append(f"| {name} | ERROR {s['error'][:80]} |")
              else:
                  nn = " | ".join(str(s["non_null"].get(v, 0)) for v in HOURLY.split(","))
                  out.append(f"| {name} | {s['n_hours']} | {s['first']} | {s['last']} | {nn} |")
          out.append("")
          out.append("non_null counts = number of hourly values present out of n_hours (360 expected for 15 days).")
          out.append("")
          out.append("### Mean |local - api.open-meteo.com| at +24h/+72h/+120h")
          out.append("| variable | mean abs diff | samples |")
          out.append("|---|---|---|")
          for v, ds in diffs.items():
              if ds:
                  out.append(f"| {v} | {sum(ds)/len(ds):.3f} | {len(ds)} |")
              else:
                  out.append(f"| {v} | n/a | 0 |")
          out.append(f"\nremote_errors: {summary['remote_errors']}")
          text = "\n".join(out)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(text + "\n")
          EOF

      - name: Dump synced layout
        if: always()
        run: |
          docker run --rm -v open-meteo-data:/app/data alpine \
            sh -c 'du -sh /app/data; find /app/data -maxdepth 2 -type d | sort | head -60' || true
