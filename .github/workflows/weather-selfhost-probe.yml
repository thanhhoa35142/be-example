name: weather-selfhost-probe

# Phase 0 probe for docs/WEATHER_SELFHOST_PROPOSAL.md:
# measures whether a self-hosted Open-Meteo container on a GitHub runner
# can serve all 6 hourly variables our worker needs, for ~15 days,
# within runner disk/time limits — and how far its output drifts from
# api.open-meteo.com.
#
# Nothing is written to any database; this only exercises the container.
# Usage: Actions → weather-selfhost-probe → Run workflow.
#
# Model findings so far (2026-11-15):
#   - /v1/forecast default `best_match` requires MANY synced domains
#     (gfs global group + gfs013 uv + ifs025 + ifsHres) -> patchy/nulls.
#   - Always pass `models=` explicitly.
#   - uv_index globally: only ncep_gfs013 (+ ukmo_uk for UK).
#   - precipitation_probability: only ensembles (ncep_gefs025/gefs05,
#     ecmwf_ifs025_ensemble, icon_eps) - ncep_gefs025 ships ONLY that var.
#   - Candidate minimal set: ncep_gfs013 + ncep_gefs025 -> models=gfs_global
#     (gfs_global = gfs013 primary + ensembles secondary; missing
#     supplemental gfs025/hrrr/nbm should degrade, probe verifies).

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Sync model domains (comma-separated)"
        type: string
        default: "ncep_gfs013,ncep_gefs025"
      api_models:
        description: "Comma-separated `models=` values to probe"
        type: string
        default: "gfs_global,gfs013"
      past_days:
        description: "Sync --past-days (keep recent files only)"
        type: string
        default: "2"

concurrency:
  group: weather-selfhost-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      MODELS: ${{ inputs.models }}
      API_MODELS: ${{ inputs.api_models }}
      PAST_DAYS: ${{ inputs.past_days }}
      # Raw storage variables backing our 6 API outputs:
      #   temperature_2m            -> temperature_2m
      #   apparent_temperature      <- temperature_2m + relative_humidity_2m + wind_u/v_10m (+ dew_point_2m)
      #   precipitation_probability <- ensembles only (ncep_gefs025 ships just this)
      #   wind_speed_10m            <- wind_u_component_10m + wind_v_component_10m
      #   uv_index                  <- uv_index (gfs013 / ukmo_uk only)
      #   cloud_cover               <- cloud_cover
      VARS: "temperature_2m,relative_humidity_2m,dew_point_2m,wind_u_component_10m,wind_v_component_10m,precipitation,precipitation_probability,cloud_cover,uv_index,shortwave_radiation"
      IMAGE: ghcr.io/open-meteo/open-meteo:latest

    steps:
      - name: Disk before
        run: df -h / /mnt 2>/dev/null || df -h /

      - name: Create data volume
        run: docker volume create open-meteo-data

      - name: Sync DEM (required for terrain/uv corrections)
        run: |
          docker run --rm -v open-meteo-data:/app/data $IMAGE \
            sync copernicus_dem90 static

      - name: Sync model data
        run: |
          echo "models=$MODELS past_days=$PAST_DAYS"
          time docker run --rm -v open-meteo-data:/app/data $IMAGE \
            sync "$MODELS" "$VARS" --past-days "$PAST_DAYS" --concurrent 8

      - name: Disk after sync
        run: |
          df -h / /mnt 2>/dev/null || df -h /
          docker run --rm -v open-meteo-data:/app/data alpine \
            sh -c 'du -sh /app/data; find /app/data -maxdepth 2 -type d | sort' || true

      - name: Start API server
        run: |
          docker run -d --name open-meteo -v open-meteo-data:/app/data \
            -p 8080:8080 $IMAGE serve --env production --hostname 0.0.0.0 --port 8080
          for i in $(seq 1 60); do
            curl -sf "http://localhost:8080/v1/forecast?latitude=52.37&longitude=4.90&hourly=temperature_2m&forecast_days=1&models=gfs013" >/dev/null && break
            sleep 2
          done

      - name: Probe cells vs api.open-meteo.com
        run: |
          python3 - <<'EOF'
          import json, urllib.request, datetime, os, time

          HOURLY = "temperature_2m,apparent_temperature,precipitation_probability,wind_speed_10m,uv_index,cloud_cover"
          VARS = HOURLY.split(",")
          # ~14 cells spread over our coverage (lat -38..59, lng -123..153)
          CELLS = [
            ("Amsterdam", 52.37, 4.90), ("Paris", 48.85, 2.35),
            ("London", 51.51, -0.13), ("Berlin", 52.52, 13.40),
            ("New York", 40.71, -74.01), ("Chicago", 41.88, -87.63),
            ("Los Angeles", 34.05, -118.24), ("Vancouver", 49.28, -123.12),
            ("Singapore", 1.35, 103.82), ("Tokyo", 35.68, 139.69),
            ("Sydney", -33.87, 151.21), ("Rio", -22.91, -43.17),
            ("Nairobi", -1.29, 36.82), ("Helsinki", 60.17, 24.94),
          ]
          today = datetime.date.today()
          start = today.isoformat()
          end = (today + datetime.timedelta(days=15)).isoformat()
          API_MODELS = [m for m in os.environ.get("API_MODELS", "gfs_global").split(",") if m]

          def fetch(base, lat, lng, models=None):
            q = (f"latitude={lat}&longitude={lng}&hourly={HOURLY}"
                 f"&timezone=UTC&start_date={start}&end_date={end}"
                 f"&wind_speed_unit=kmh&precipitation_unit=mm")
            if models:
                q += f"&models={models}"
            req = urllib.request.Request(base + "/v1/forecast?" + q,
                                         headers={"User-Agent": "pickhour-probe/0.1"})
            with urllib.request.urlopen(req, timeout=90) as r:
                return json.load(r)

          LOCAL = "http://localhost:8080"
          REMOTE = "https://api.open-meteo.com"
          out = ["## Self-host probe results", ""]
          out.append(f"Synced domains: `{os.environ.get('MODELS')}`")
          out.append(f"API models probed: `{', '.join(API_MODELS)}`")
          out.append(f"Window: {start} .. {end} UTC")
          out.append("")

          remote_errors = 0
          # Per models= selection: per-cell non-null counts
          for sel in API_MODELS:
            out.append(f"### models={sel}")
            out.append("| cell | hours | first | last | " + " | ".join(VARS) + " |")
            out.append("|---|---|---|---|" + "---|" * len(VARS))
            for name, lat, lng in CELLS:
                try:
                    loc = fetch(LOCAL, lat, lng, sel)
                except Exception as e:
                    out.append(f"| {name} | ERROR {str(e)[:80]} |")
                    continue
                h = loc.get("hourly", {})
                times = h.get("time", [])
                nn = " | ".join(str(sum(1 for x in (h.get(v) or []) if x is not None)) for v in VARS)
                out.append(f"| {name} | {len(times)} | {times[0] if times else '-'} | {times[-1] if times else '-'} | {nn} |")
            out.append("")
            time.sleep(1)

          # Drift vs hosted api.open-meteo.com for the first api_models entry
          sel = API_MODELS[0]
          out.append(f"### Drift vs api.open-meteo.com (models={sel}, +24h/+72h/+120h)")
          out.append("| cell | variable | mean abs diff | samples |")
          out.append("|---|---|---|---|")
          diffs = {}
          for name, lat, lng in CELLS:
            try:
                loc = fetch(LOCAL, lat, lng, sel)
            except Exception:
                continue
            h = loc.get("hourly", {})
            times = h.get("time", [])
            try:
                rem = fetch(REMOTE, lat, lng, sel)
            except Exception:
                remote_errors += 1
                time.sleep(2)
                continue
            rh = rem.get("hourly", {})
            rt = rh.get("time", [])
            for v in VARS:
                a, b = h.get(v) or [], rh.get(v) or []
                ds = diffs.setdefault(v, [])
                for idx in (24, 72, 120):
                    if idx < len(a) and idx < len(b) and a[idx] is not None and b[idx] is not None \
                       and idx < len(rt) and rt[idx] == times[idx]:
                        ds.append(abs(a[idx] - b[idx]))
            time.sleep(2)
          for v in VARS:
              ds = diffs.get(v, [])
              out.append(f"| all | {v} | {sum(ds)/len(ds):.3f} | {len(ds)} |" if ds else f"| all | {v} | n/a | 0 |")
          out.append(f"\nremote_errors: {remote_errors}")
          text = "\n".join(out)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(text + "\n")
          EOF
