name: gfs-lag-probe

# Measures when fresh GFS/GEFS cycles land on the open-data bucket by
# polling Last-Modified of representative chunk files. GFS cycles run at
# 00/06/12/18 UTC; the lag between cycle start and Last-Modified is what
# determines the weather-refresh cron (docs/WEATHER_SELFHOST_PROPOSAL.md).
#
# Safe to delete once the schedule is chosen — it exists only to collect
# ~24-48h of lag samples across several cycles.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe chunk Last-Modified
        run: |
          now=$(date -u +%s)
          printf "| file | last_modified | age_min |\n|---|---|---|\n" >> "$GITHUB_STEP_SUMMARY"
          for path in \
            ncep_gfs013/temperature_2m/chunk_1036.om \
            ncep_gfs013/cloud_cover/chunk_1036.om \
            ncep_gfs013/uv_index/chunk_1036.om \
            ncep_gfs013/wind_u_component_10m/chunk_1036.om \
            ncep_gefs025/precipitation_probability/chunk_345.om \
            ncep_gefs05/precipitation_probability/chunk_530.om \
            ncep_gefs05/precipitation_probability/chunk_531.om \
          ; do
            lm=$(curl -sI "https://openmeteo.s3.amazonaws.com/data/$path" | tr -d '\r' | awk 'tolower($1)=="last-modified:"{print $2, $3, $4, $5, $6}')
            ts=$(date -u -d "$lm" +%s 2>/dev/null || echo 0)
            age=$(( (now - ts) / 60 ))
            echo "$path | $lm | $age" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "now_utc=$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
