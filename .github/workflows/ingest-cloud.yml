name: ingest-cloud

# Manual cloud ingest: downloads Geofabrik extracts, runs the osmium
# pipeline for all city packs, refreshes weather/crowd/scores, then
# uploads a pg_dump artifact to restore into a scratch local DB.
#
# Usage: Actions → ingest-cloud → Run workflow (branch: dev).
# Private-repo free tier: ~2000 min/month — a full run is roughly
# 1.5-3h depending on extract sizes.

on:
  workflow_dispatch:
    inputs:
      france:
        description: "Also ingest Paris (europe/france-latest ~4.5GB, +~1h)"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: picnic
          POSTGRES_USER: picnic
          POSTGRES_PASSWORD: picnic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U picnic -d picnic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://picnic:picnic@localhost:5432/picnic?sslmode=disable"
      INGEST_SOURCE: osmium
      INGEST_EXTRACT_DIR: ${{ github.workspace }}/data/extracts
      EXTRACTS: "luxembourg belgium netherlands austria switzerland"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install osmium-tool + psql
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool postgresql-client
          osmium --version | head -1

      - name: Download Go modules
        run: go mod download

      - name: Download Geofabrik extracts
        env:
          FRANCE: ${{ inputs.france }}
        run: |
          mkdir -p "$INGEST_EXTRACT_DIR"
          cd "$INGEST_EXTRACT_DIR"
          COUNTRIES="$EXTRACTS"
          [ "$FRANCE" = "true" ] && COUNTRIES="$COUNTRIES france"
          for c in $COUNTRIES; do
            curl -fSL --retry 3 -o "$c-latest.osm.pbf" \
              "https://download.geofabrik.de/europe/$c-latest.osm.pbf" &
          done
          wait
          ls -lh

      - name: Validate extracts
        run: |
          cd "$INGEST_EXTRACT_DIR"
          for f in *.osm.pbf; do
            echo "== $f"; osmium fileinfo "$f" | head -8
          done

      - name: Migrate
        run: go run ./cmd/migrate

      - name: Verify dump path early (empty DB)
        # Fails fast if pg_dump auth/connectivity is broken — cheaper than
        # discovering it after a multi-hour ingest.
        run: |
          docker run --rm --network host -e PGPASSWORD=picnic \
            postgis/postgis:18-3.6 \
            pg_dump -h localhost -U picnic -d picnic -Fc -Z9 \
            -f /tmp/probe.dump
          ls -lh /tmp/probe.dump

      - name: Create city packs
        env:
          PGCONNECT_TIMEOUT: 10
          FRANCE: ${{ inputs.france }}
        run: |
          EXTRA=""
          if [ "$FRANCE" = "true" ]; then
            EXTRA=",('paris','Paris','FR','Europe/Paris', ST_MakeEnvelope(2.20,48.75,2.50,49.00,4326),'beta','europe/france-latest','1970-01-01')"
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<SQL
          insert into t_city_packs (slug,name,country,tz,boundary,status,osm_extract,last_import_at) values
           ('luxembourg','Luxembourg','LU','Europe/Luxembourg', ST_MakeEnvelope(5.70,49.40,6.55,50.20,4326),'beta','europe/luxembourg-latest','1970-01-01'),
           ('brussels','Brussels','BE','Europe/Brussels', ST_MakeEnvelope(4.25,50.75,4.50,50.95,4326),'beta','europe/belgium-latest','1970-01-01'),
           ('amsterdam','Amsterdam','NL','Europe/Amsterdam', ST_MakeEnvelope(4.70,52.25,5.10,52.45,4326),'beta','europe/netherlands-latest','1970-01-01'),
           ('rotterdam','Rotterdam','NL','Europe/Amsterdam', ST_MakeEnvelope(4.35,51.85,4.60,52.00,4326),'beta','europe/netherlands-latest','1970-01-01'),
           ('utrecht','Utrecht','NL','Europe/Amsterdam', ST_MakeEnvelope(4.95,52.05,5.20,52.15,4326),'beta','europe/netherlands-latest','1970-01-01'),
           ('denhaag','The Hague','NL','Europe/Amsterdam', ST_MakeEnvelope(4.20,52.00,4.45,52.12,4326),'beta','europe/netherlands-latest','1970-01-01'),
           ('vienna','Vienna','AT','Europe/Vienna', ST_MakeEnvelope(16.05,48.05,16.65,48.35,4326),'beta','europe/austria-latest','1970-01-01'),
           ('zurich','Zurich','CH','Europe/Zurich', ST_MakeEnvelope(8.35,47.30,8.65,47.48,4326),'beta','europe/switzerland-latest','1970-01-01')
          $EXTRA;
          SQL
          COUNT=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from t_city_packs where status in ('beta','live')")
          echo "packs=$COUNT"
          [ "$COUNT" -ge 8 ] || { echo "pack insert failed"; exit 1; }

      - name: Ingest packs
        env:
          FRANCE: ${{ inputs.france }}
        run: |
          go build -o /tmp/worker ./cmd/worker
          packs="luxembourg brussels amsterdam rotterdam utrecht denhaag vienna zurich"
          [ "$FRANCE" = "true" ] && packs="$packs paris"
          for p in $packs; do
            echo "=== ingest $p ==="
            /tmp/worker -job ingest.osm -pack "$p"
          done

      - name: Weather refresh
        run: /tmp/worker -job weather.refresh

      - name: Crowd refresh
        run: /tmp/worker -job crowd.refresh

      - name: Scoring recompute
        run: /tmp/worker -job scoring.recompute

      - name: Collect stats
        run: |
          {
            echo "## Ingest results"
            psql "$DATABASE_URL" -c "select p.slug, p.country, s.status, count(*) from t_spots s join t_city_packs p on p.id=s.city_pack_id group by 1,2,3 order by 1,3"
            echo
            echo "## Spot sources by via"
            psql "$DATABASE_URL" -c "select via, count(*) from t_spot_sources group by 1"
            echo
            echo "## Scores"
            psql "$DATABASE_URL" -c "select count(distinct spot_id) spots, count(*) rows, min(ts_hour), max(ts_hour) from t_spot_scores"
            echo
            echo "## Job runs"
            psql "$DATABASE_URL" -c "select job, status, started_at::timestamp(0), stats is not null has_stats from t_job_runs order by id desc limit 30"
          } | tee ingest-summary.md

      - name: Upload ingest summary
        # Lands before the dump step so results survive a dump failure.
        uses: actions/upload-artifact@v4
        with:
          name: ingest-summary
          path: ingest-summary.md
          retention-days: 30
          if-no-files-found: error

      - name: Dump database (excluding raw ingest layer)
        run: |
          # t_ingest_features is the bulk raw layer (~400k geojson rows) and
          # is re-derivable by re-running ingest; excluding it keeps the
          # artifact small enough for the 500MB free storage quota.
          docker run --rm --network host -e PGPASSWORD=picnic \
            -v "$PWD:/out" postgis/postgis:18-3.6 \
            pg_dump -h localhost -U picnic -d picnic -Fc -Z9 \
            -T t_ingest_features -f /out/pickhour-cloud.dump
          ls -lh pickhour-cloud.dump

      - uses: actions/upload-artifact@v4
        with:
          name: pickhour-cloud-dump
          path: |
            pickhour-cloud.dump
            ingest-summary.md
          retention-days: 30
          if-no-files-found: error
