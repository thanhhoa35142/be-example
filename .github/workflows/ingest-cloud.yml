name: ingest-cloud

# Manual cloud ingest: downloads Geofabrik extracts, runs the osmium
# pipeline for the selected city packs, refreshes weather/crowd/scores,
# then uploads a pg_dump artifact to restore into a local DB
# (scripts/ingest/restore-local.sh).
#
# Usage: Actions → ingest-cloud → Run workflow (branch: dev).
# Packs live in scripts/ingest/packs.tsv (one row per city, smallest
# Geofabrik region that contains it). Select by group key and/or slug:
#   "lu be nl at ch"        Benelux + Alps (previous default)
#   "eu"                    expands to every European group
#   "us au gb"              new markets
#   "berlin paris sydney"   individual packs
#   "all"                   everything (~40 packs)
# Private-repo free tier: ~2000 min/month. Extracts are processed one at a
# time with the next download overlapped, so wall time ≈ total download +
# osmium time; per-pack ingest is seconds since the 2026-11-13 planner work.

on:
  workflow_dispatch:
    inputs:
      packs:
        description: "Groups/slugs from scripts/ingest/packs.tsv, space-separated. Groups: lu be nl at ch de fr es it pt dk se ie cz pl gb us au. Shortcuts: eu, all"
        type: string
        default: "lu be nl at ch"

concurrency:
  group: ingest-cloud
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: picnic
          POSTGRES_USER: picnic
          POSTGRES_PASSWORD: picnic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U picnic -d picnic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --shm-size 1g

    env:
      DATABASE_URL: "postgres://picnic:picnic@localhost:5432/picnic?sslmode=disable"
      INGEST_SOURCE: osmium
      OUT_DIR: ${{ github.workspace }}/out
      WORKER: /tmp/worker
      PACKS: ${{ inputs.packs }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve selection
        run: |
          sel=""
          for t in $PACKS; do
            # "eu" = every European group (keep in sync with packs.tsv)
            if [ "$t" = eu ]; then t="lu be nl at ch de fr es it pt dk se ie cz pl gb"; fi
            sel="${sel:+$sel }$t"
          done
          [ -n "$sel" ] || { echo "::error::empty selection"; exit 1; }
          echo "SELECTION=$sel" >> "$GITHUB_ENV"
          echo "selection: $sel"

      - name: Prepare extract disk
        # Prefer /mnt (runner's second disk, usually ~70 GB free); the root
        # disk has ~14 GB. At most ~2 raw extracts + artifacts live at once.
        run: |
          dir="$GITHUB_WORKSPACE/data/extracts"
          if [ -d /mnt ] && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -ge 20 ]; then
            dir=/mnt/extracts
          fi
          sudo mkdir -p "$dir" && sudo chown "$USER" "$dir"
          echo "INGEST_EXTRACT_DIR=$dir" >> "$GITHUB_ENV"
          df -h / "$dir"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install osmium-tool + psql
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool postgresql-client
          osmium --version | head -1

      - name: Build worker
        run: go build -o "$WORKER" ./cmd/worker

      - name: Migrate
        run: go run ./cmd/migrate

      - name: Verify dump path early (empty DB)
        # Fails fast if pg_dump auth/connectivity is broken — cheaper than
        # discovering it after a multi-hour ingest.
        run: |
          docker run --rm --network host -e PGPASSWORD=picnic \
            -v "$PWD:/out" postgis/postgis:18-3.6 \
            pg_dump -h localhost -U picnic -d picnic -Fc -Z9 \
            -f /out/probe.dump
          ls -lh probe.dump && rm probe.dump

      - name: Ingest packs
        timeout-minutes: 300
        # Never fails the job by itself: per-pack failures are collected in
        # out/failures.txt and enforced in the last step, after the dump of
        # everything that did succeed has been uploaded.
        env:
          RUN_MIGRATIONS: "false"
        run: |
          chmod +x scripts/ingest/cloud-ingest.sh
          scripts/ingest/cloud-ingest.sh scripts/ingest/packs.tsv $SELECTION

      - name: Weather refresh
        # External provider: a flaky API must not cost the whole run's dump.
        continue-on-error: true
        env:
          RUN_MIGRATIONS: "false"
        run: $WORKER -job weather.refresh

      - name: Crowd refresh
        # External provider: a flaky API must not cost the whole run's dump.
        continue-on-error: true
        env:
          RUN_MIGRATIONS: "false"
        run: $WORKER -job crowd.refresh

      - name: Scoring recompute
        env:
          RUN_MIGRATIONS: "false"
        run: $WORKER -job scoring.recompute

      - name: Collect stats
        if: always()
        run: |
          {
            echo "## Selection"
            echo '`'"$SELECTION"'`'
            echo
            echo "## Pack results"
            echo '```'
            column -t -s $'\t' "$OUT_DIR/pack-results.tsv" 2>/dev/null || echo "(none)"
            echo '```'
            if [ -s "$OUT_DIR/failures.txt" ]; then
              echo "## Failures"
              sed 's/^/- /' "$OUT_DIR/failures.txt"
              echo
            fi
            echo "## Spots per pack"
            echo '```'
            psql "$DATABASE_URL" -c "select p.slug, p.country, count(*) filter (where s.status='active') active, count(*) filter (where s.status='pending') pending, count(*) filter (where s.status not in ('active','pending')) other, count(*) filter (where s.area is not null) with_area from t_city_packs p left join t_spots s on s.city_pack_id=p.id group by 1,2 order by 2,1"
            echo
            echo "## Ingest stats per pack (t_job_runs)"
            psql "$DATABASE_URL" -c "select x->>'pack' pack, (x->'stats'->>'features_read')::int features, (x->'stats'->>'candidates')::int cand, (x->'stats'->>'created')::int created, (x->'stats'->>'duplicate_geoms')::int dup_geoms, (x->'stats'->>'amenities_linked')::int amenities, (x->>'duration_ms')::int ms, x->'stats'->'stage_ms' stage_ms, x->>'error' error from t_job_runs r, jsonb_array_elements(r.stats->'packs') x where r.job='ingest.osm' order by r.id"
            echo
            echo "## Spot sources by via"
            psql "$DATABASE_URL" -c "select via, count(*) from t_spot_sources group by 1"
            echo
            echo "## Scores"
            psql "$DATABASE_URL" -c "select count(distinct spot_id) spots, count(*) rows, min(ts_hour), max(ts_hour) from t_spot_scores"
            echo
            echo "## Job runs"
            psql "$DATABASE_URL" -c "select job, status, started_at::timestamp(0), finished_at - started_at as duration from t_job_runs order by id desc limit 60"
            echo '```'
          } | tee ingest-summary.md
          cat ingest-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ingest summary + logs
        # Lands before the dump step so results survive a dump failure.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-summary
          path: |
            ingest-summary.md
            out/*.log
            out/*.tsv
            out/failures.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Dump database (excluding raw ingest layer)
        run: |
          # t_ingest_features is the bulk raw layer, re-derivable by
          # re-running ingest; t_ingest_staging is an empty UNLOGGED COPY
          # target. Exclude their DATA only — the tables themselves must be
          # in the dump (schema_migrations says they exist; -T would drop
          # them and break ingest on the restored DB).
          docker run --rm --network host -e PGPASSWORD=picnic \
            -v "$PWD:/out" postgis/postgis:18-3.6 \
            pg_dump -h localhost -U picnic -d picnic -Fc -Z9 \
            --exclude-table-data=t_ingest_features \
            --exclude-table-data=t_ingest_staging \
            -f /out/pickhour-cloud.dump
          ls -lh pickhour-cloud.dump

      - uses: actions/upload-artifact@v4
        with:
          name: pickhour-cloud-dump
          path: |
            pickhour-cloud.dump
            ingest-summary.md
          retention-days: 30
          if-no-files-found: error

      - name: Fail on pack failures
        run: |
          if [ -s "$OUT_DIR/failures.txt" ]; then
            echo "::error::$(wc -l < "$OUT_DIR/failures.txt") pack/extract failures — see ingest-summary"
            cat "$OUT_DIR/failures.txt"
            exit 1
          fi
